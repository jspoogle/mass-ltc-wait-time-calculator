name: Keep Mass LTC Calculator Awake

on:
  schedule:
    - cron: '0 */8 * * *'   # Every 8 hours (more reliable than 30 min)

jobs:
  keep-awake:
    runs-on: ubuntu-24.04   # Use newer runner
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Empty commit to prevent sleep
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Keep LTC calculator awake - $(date)"
          git push
